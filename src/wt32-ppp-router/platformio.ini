; WT32-ETH01 PPP-to-Ethernet router (ESP-IDF framework)

[env:wt32-eth01]
; 6.13.0 = ESP-IDF v5.5.3. Don't float to 7.x (IDF 6): the Ethernet PHY
; drivers moved out of IDF there and this code would need changes.
platform = espressif32 @ 6.13.0
board = wt32-eth01
framework = espidf

; Flashing/log via the IO1/IO3 header with a 3.3V USB-serial adapter.
; Hold IO0 low while powering up to enter the bootloader.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
